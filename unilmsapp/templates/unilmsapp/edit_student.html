{% extends 'unilmsapp/manager_base.html' %}

{% block title %}
Edit Student
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="mb-4">

        <h2 class="fw-bold">
            Edit Student
        </h2>

        <p class="text-muted">
            Update student information
        </p>

    </div>


    <div class="card shadow-sm border-0 rounded-4">

        <div class="card-body p-4">

            <form method="POST">

                {% csrf_token %}

                <div class="row">

                    <!-- NAME -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ student.name }}"
                               required>

                    </div>


                    <!-- EMAIL -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ student.email }}"
                               required>

                    </div>


                    <!-- ADDRESS -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label fw-semibold">
                            Address
                        </label>

                        <input type="text"
                               name="address"
                               class="form-control"
                               value="{{ student.address }}">

                    </div>


                    <!-- DEPARTMENT -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Department
                        </label>

                        <input type="text"
                               name="dept"
                               class="form-control"
                               value="{{ student.dept }}"
                               required>

                    </div>


                    <!-- SEMESTER -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Semester
                        </label>

                        <input type="number"
                               name="sem"
                               class="form-control"
                               value="{{ student.sem }}"
                               min="1"
                               max="8">

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="d-flex justify-content-between mt-4">

                    <a href="{% url 'manager_students' %}"
                       class="btn btn-secondary">

                        <i class="fa-solid fa-arrow-left me-2"></i>

                        Back

                    </a>


                    <button type="submit"
                            class="btn btn-primary">

                        <i class="fa-solid fa-save me-2"></i>

                        Save Changes

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
