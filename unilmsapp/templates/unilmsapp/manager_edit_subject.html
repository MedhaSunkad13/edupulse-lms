{% extends 'unilmsapp/manager_base.html' %}

{% block title %}
Edit Subject
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="mb-4">

        <h2 class="fw-bold">
            Edit Subject
        </h2>

        <p class="text-muted">
            Update subject details and faculty assignment
        </p>

    </div>


    <div class="card shadow-sm border-0 rounded-4">

        <div class="card-body p-4">

            <form method="POST">

                {% csrf_token %}


                <!-- SUBJECT CODE -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Subject Code
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ subject.sub_code }}"
                        readonly
                    >

                </div>


                <!-- SUBJECT NAME -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Subject Name
                    </label>

                    <input
                        type="text"
                        name="sub_name"
                        class="form-control"
                        value="{{ subject.sub_name }}"
                        required
                    >

                </div>


                <!-- FACULTY -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Faculty
                    </label>

                    <select
                        name="faculty"
                        class="form-select"
                        required
                    >

                        {% for teacher in faculty %}

                        <option
                            value="{{ teacher.profile_id }}"
                            {% if teacher.profile_id == subject.faculty.profile_id %}
                                selected
                            {% endif %}
                        >

                            {{ teacher.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- BUTTONS -->

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        <i class="fa-solid fa-save me-2"></i>

                        Save Changes

                    </button>


                    <a
                        href="{% url 'manager_subjects' %}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
