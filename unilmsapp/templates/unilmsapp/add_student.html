{% extends 'unilmsapp/manager_base.html' %}

{% block title %}
Add Student
{% endblock %}


{% block content %}

<div class="container-fluid p-4">

    <!-- HEADER -->

    <div class="mb-4">

        <h2 class="fw-bold">
            Add Student
        </h2>

        <p class="text-muted">
            Create a new student account.
        </p>

    </div>


    <!-- MESSAGES -->

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <!-- FORM -->

    <div class="card border-0 shadow-sm rounded-4">

        <div class="card-body p-4">

            <form method="POST">

                {% csrf_token %}


                <div class="row">


                    <!-- NAME -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Student Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter student name"
                            required
                        >

                    </div>


                    <!-- USERNAME -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter email address"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            required
                        >

                    </div>


                    <!-- DEPARTMENT -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Department
                        </label>

                        <input
                            type="text"
                            name="dept"
                            class="form-control"
                            placeholder="Enter department"
                            required
                        >

                    </div>


                    <!-- SEMESTER -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Semester
                        </label>

                        <select
                            name="sem"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select semester
                            </option>

                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>

                        </select>

                    </div>


                </div>


                <!-- BUTTONS -->

                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-primary px-4"
                    >

                        <i class="fa-solid fa-plus me-2"></i>

                        Add Student

                    </button>


                    <a
                        href="{% url 'manager_students' %}"
                        class="btn btn-light border px-4 ms-2"
                    >

                        Cancel

                    </a>

                </div>


            </form>

        </div>

    </div>

</div>

{% endblock %}
