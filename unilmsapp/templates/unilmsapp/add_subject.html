{% extends 'unilmsapp/manager_base.html' %}

{% block title %}
Add Subject
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="mb-4">

        <h2 class="fw-bold">
            Add Subject
        </h2>

        <p class="text-muted">
            Add a new subject to the LMS
        </p>

    </div>


    <div class="card shadow-sm border-0 rounded-4">

        <div class="card-body p-4">

            <form method="POST">

                {% csrf_token %}


                <!-- SUBJECT CODE -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Subject Code
                    </label>

                    <input
                        type="text"
                        name="sub_code"
                        class="form-control"
                        placeholder="Enter subject code"
                        required
                    >

                </div>


                <!-- SUBJECT NAME -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Subject Name
                    </label>

                    <input
                        type="text"
                        name="sub_name"
                        class="form-control"
                        placeholder="Enter subject name"
                        required
                    >

                </div>


                <!-- FACULTY -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Faculty
                    </label>

                    <select
                        name="faculty"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Faculty
                        </option>

                        {% for f in faculty %}

                        <option value="{{ f.profile_id }}">
                            {{ f.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- COURSE COLOR -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Course Color
                    </label>

                    <input
                        type="color"
                        name="colour"
                        class="form-control form-control-color"
                        value="#c084f5"
                        title="Choose course color"
                    >

                </div>


                <!-- BUTTONS -->

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >

                        <i class="fa-solid fa-plus me-2"></i>

                        Add Subject

                    </button>


                    <a
                        href="{% url 'manager_subjects' %}"
                        class="btn btn-secondary"
                    >

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
