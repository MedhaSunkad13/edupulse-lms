{% extends 'unilmsapp/manager_base.html' %}

{% block title %}Delete Faculty{% endblock %}

{% block content %}

<div class="container-fluid p-4">

    <div class="card border-0 shadow-sm rounded-4">

        <div class="card-body p-5 text-center">

            <div class="mb-4">

                <i class="fa-solid fa-triangle-exclamation text-danger"
                   style="font-size: 50px;">
                </i>

            </div>


            <h3 class="fw-bold mb-3">
                Delete Faculty?
            </h3>


            <p class="text-muted">

                Are you sure you want to delete

                <strong>
                    {{ faculty.name }}
                </strong>

                ?

            </p>


            <p class="text-danger small">

                This will also remove their login account.

            </p>


            <form method="POST">

                {% csrf_token %}


                <button
                    type="submit"
                    class="btn btn-danger px-4"
                >

                    <i class="fa-solid fa-trash me-2"></i>

                    Yes, Delete

                </button>


                <a
                    href="{% url 'manager_faculty' %}"
                    class="btn btn-light border px-4 ms-2"
                >

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
